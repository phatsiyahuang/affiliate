<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a09" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>ตัดต่อคลิปสั้น พร้อมโพสต์ · Affiliate</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0c0a09; --card:#1c1917; --card2:#292524; --line:#3a3532; --txt:#fafaf9; --mut:#a8a29e;
    --acc:#fb923c; --acc2:#f97316; --ok:#4ade80; --bad:#f87171; --brand:#fe2c55;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 'IBM Plex Sans Thai',system-ui,-apple-system,'Noto Sans Thai',sans-serif; }
  button,input,select,textarea,label { touch-action:manipulation; font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:20; background:rgba(12,10,9,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
           padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:10px; }
  header a { color:var(--mut); text-decoration:none; font-size:22px; width:36px; height:36px; display:grid; place-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; line-height:1.2; }
  header p { margin:0; font-size:11px; color:var(--mut); }
  main { max-width:560px; margin:0 auto; padding:14px 16px calc(150px + env(safe-area-inset-bottom)); }
  h2 { font-size:17px; margin:2px 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
  .card h3 { font-size:14px; margin:0 0 10px; font-weight:600; }
  .lbl { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
  .inp { width:100%; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:11px 12px; min-height:46px; font-size:16px; }
  .inp:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(251,146,60,.25); }
  textarea.inp { resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; }
  .grow { flex:1; min-width:0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--card2); border-radius:999px; padding:9px 14px; min-height:42px; cursor:pointer; font-size:14px; }
  .chip.on { background:var(--txt); color:#0c0a09; border-color:var(--txt); font-weight:600; }
  .btn { border:0; border-radius:14px; min-height:50px; padding:0 18px; font-weight:600; font-size:16px; cursor:pointer; background:var(--card2); border:1px solid var(--line); }
  .btn.pri { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#1c0a00; border:0; }
  .btn.sm { min-height:40px; font-size:13px; padding:0 12px; border-radius:10px; }
  .btn:disabled { opacity:.45; }
  .btn.block { width:100%; }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--card2); color:var(--mut); }
  .tag.hook { background:#7c2d12; color:#fed7aa; }
  .tag.bad { background:#450a0a; color:#fecaca; }
  .tag.ok { background:#052e16; color:#bbf7d0; }
  .drop { display:grid; place-items:center; text-align:center; gap:4px; border:2px dashed var(--line); border-radius:16px; padding:26px 12px; cursor:pointer; }
  .drop b { font-size:16px; } .drop span { color:var(--mut); font-size:13px; }
  .clip { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .clip:first-child { border-top:0; }
  .clip video { width:44px; height:64px; object-fit:cover; border-radius:8px; background:#000; }
  .x { background:none; border:0; color:var(--mut); font-size:20px; width:40px; height:40px; cursor:pointer; }
  .seg { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .seg:first-child { border-top:0; }
  .seg img { width:54px; height:96px; object-fit:cover; border-radius:8px; background:#000; flex:none; }
  .seg .meta { flex:1; min-width:0; }
  .seg .meta .inp { min-height:38px; padding:6px 10px; font-size:14px; margin-top:6px; }
  .bar { height:5px; border-radius:3px; background:var(--card2); overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80); }
  .ctl { display:flex; flex-direction:column; gap:4px; }
  .ctl button { width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card2); cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--acc); height:34px; }
  .sw { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; }
  .sw input { width:46px; height:26px; accent-color:var(--acc); flex:none; }
  nav.steps { position:fixed; bottom:0; left:0; right:0; z-index:25; background:rgba(12,10,9,.96); backdrop-filter:blur(8px);
              border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:env(safe-area-inset-bottom); }
  nav.steps button { background:none; border:0; color:var(--mut); padding:8px 0 9px; font-size:11px; min-height:56px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav.steps button b { width:24px; height:24px; border-radius:50%; background:var(--card2); display:grid; place-items:center; font-size:12px; }
  nav.steps button.on { color:var(--txt); } nav.steps button.on b { background:var(--acc); color:#1c0a00; }
  nav.steps button.done b { background:#14532d; color:#bbf7d0; }
  .cta { position:fixed; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom)); z-index:24; padding:10px 16px; background:linear-gradient(transparent,var(--bg) 40%); }
  .cta .btn { max-width:528px; margin:0 auto; display:block; width:100%; }
  .stage { position:relative; width:min(100%,calc(62vh*9/16)); margin:0 auto 12px; aspect-ratio:9/16; background:#000; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  .stage canvas { width:100%; height:100%; display:block; }
  .prog { height:10px; border-radius:6px; background:var(--card2); overflow:hidden; } .prog i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
  .note { font-size:12px; color:var(--mut); background:var(--card2); border-radius:10px; padding:8px 10px; margin-top:10px; }
  .note.warn { background:#422006; color:#fde68a; }
  .sfxbtns { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .hidden { display:none !important; }
  video.result { width:100%; border-radius:14px; background:#000; max-height:70vh; }
  #toast { position:fixed; left:50%; bottom:150px; transform:translateX(-50%); background:#fff; color:#000; padding:8px 14px; border-radius:999px; font-size:13px; z-index:50; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>
<body>

<header>
  <a href="index.html" aria-label="กลับ">‹</a>
  <div>
    <h1>🎬 ตัดต่อคลิปพร้อมโพสต์</h1>
    <p>สินค้า & สถานที่ · Hook 3 วิ · ซาวด์เอฟเฟกต์ · 9:16</p>
  </div>
</header>

<main id="main"></main>
<div class="cta" id="cta"></div>
<nav class="steps" id="steps"></nav>
<div id="toast"></div>
<canvas id="cv" width="720" height="1280" hidden></canvas>

<script>
'use strict';
// ====================================================================
//  ค่าคงที่ / แพลตฟอร์ม
// ====================================================================
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const fmtT = (s) => s.toFixed(1) + ' วิ';
const money = (n) => '฿' + Number(n).toLocaleString('en-US');

const PLAT = {
  tiktok: { name:'TikTok Shop',    color:'#fe2c55', cta:'กดตะกร้าเหลืองเลย 🛒',      tags:['#tiktokshop','#tiktokป้ายยา','#รีวิวของดี','#ของมันต้องมี','#fyp'] },
  shopee: { name:'Shopee',         color:'#ee4d2d', cta:'กดลิงก์ในโปรไฟล์ สั่งเลย 🧡', tags:['#shopeeaffiliate','#ช้อปปี้','#shopeethailand','#รีวิวของดี','#ของมันต้องมี'] },
  lazada: { name:'Lazada',         color:'#f57224', cta:'กดลิงก์ในโปรไฟล์ ช้อปเลย 🛍️', tags:['#lazadaaffiliate','#ลาซาด้า','#lazadath','#รีวิวของดี','#ของมันต้องมี'] },
  trip:   { name:'Trip.com',       color:'#287dfa', cta:'จองเลย ลิงก์ในโปรไฟล์ ✈️',    tags:['#tripcom','#เที่ยวไทย','#จองโรงแรม','#เที่ยวคุ้ม','#รีวิวที่พัก'] },
};

const HOOKS = {
  problem: {
    label:'😤 จี้ปัญหา', retail:[
      'ยังทนกับปัญหานี้อยู่เหรอ? ดู*คลิปนี้*ก่อน!', 'เลิกทนได้แล้ว! {name} ช่วยได้*จริง*', 'ทำไมเพิ่งรู้จัก {name} เนี่ย!' ],
    trip:[ 'อยากเที่ยวแต่กลัวแพง? ดู*คลิปนี้*ก่อน!', 'เที่ยวไม่ต้องเปย์หนัก ลอง*วิธีนี้*', 'ทริปนี้ทำไมเพิ่งรู้!' ] },
  price: {
    label:'💸 ช็อกราคา', retail:[
      'ราคาแค่ *{price}* ได้ของแบบนี้เลยเหรอ!', '{name} แค่ *{price}* คุ้มเกินคาด', 'อย่าเพิ่งเลื่อน! *{price}* เองจริงๆ' ],
    trip:[ 'ที่พักแบบนี้ แค่ *{price}* เอง!', 'ทริปนี้ *{price}* คุ้มเว่อร์', 'อย่าเพิ่งเลื่อน! *{price}* เที่ยวได้เลย' ] },
  curious: {
    label:'🤔 ชวนสงสัย', retail:[
      'สิ่งนี้เปลี่ยนชีวิตฉัน*ใน 3 วินาที*', 'รู้ไหม? {name} ทำแบบนี้ได้ด้วย!', 'ของมันต้องมีที่*ไม่ค่อยมีใครบอก*' ],
    trip:[ 'ที่เที่ยวนี้*ลับมาก* ใครรู้บ้าง?', 'ห้องพักนี้มี*อะไรแบบนี้*ด้วย!', 'เที่ยวที่นี่ ต้องรู้*ข้อนี้*' ] },
  proof: {
    label:'⭐ รีวิวจริง', retail:[
      'ลองใช้แล้ว*ว้าว*จริงๆ ต้องบอกต่อ', 'รีวิว {name} จาก*การใช้จริง*', 'ใช้มาสักพัก สรุปให้ใน*วิดีโอเดียว*' ],
    trip:[ 'ไปมาแล้ว บอกเลย*คุ้ม*', 'รีวิวจาก*ประสบการณ์จริง*', 'พักมาแล้ว สรุปให้*ครบ*' ] },
  urgent: {
    label:'⏰ เร่งด่วน', retail:[
      '*โปรนี้*อย่าพลาด! รีบดู', 'ก่อนราคาขยับ! {name} *{price}*', 'ดูให้จบ แล้ว*รีบกด*' ],
    trip:[ '*จองก่อน* ราคาอาจเปลี่ยน!', 'โปรนี้ใครอยากเที่ยว*รีบดู*', 'ที่พักนี้ *{price}* ดูให้จบ!' ] },
};

const PLACE = {
  food:  { label:'🍜 ร้านอาหาร', unit:'ต่อคน', shots:['ป้ายร้าน/หน้าร้าน','เมนูเด่นแบบโคลสอัพ (ควัน/ซอส/ชีสยืด)','บรรยากาศในร้าน','ป้ายราคา/เมนู','คำชิมคำแรก'],
    tags:['#ร้านอร่อย','#รีวิวร้านอาหาร','#กินอะไรดี'], cta:'📍 พิกัดอยู่ในโปรไฟล์ ไปตามกัน!' },
  hotel: { label:'🏨 โรงแรม/ที่พัก', unit:'ต่อคืน', shots:['วิวหรือหน้าโรงแรม','เปิดประตูเข้าห้อง (room tour)','เตียง/ห้องน้ำ','สระ/อาหารเช้า/ส่วนกลาง','วิวจากระเบียง'],
    tags:['#รีวิวโรงแรม','#รีวิวที่พัก','#โรงแรมสวย'], cta:'จองเลย ลิงก์ในโปรไฟล์ 🏨' },
  spot:  { label:'🏝️ ที่เที่ยว/กิจกรรม', unit:'ต่อคน', shots:['มุมวิวที่ว้าวที่สุด','ทางเข้า/ป้ายสถานที่','กิจกรรมที่ทำจริง','ผู้คน/บรรยากาศ','ค่าเข้า/ตั๋ว'],
    tags:['#เที่ยวไทย','#ที่เที่ยว','#ที่เที่ยวสวย'], cta:'จองตั๋วเลย ลิงก์ในโปรไฟล์ 🎟️' },
};
const HOOKS_PLACE = {
  food: {
    problem:['ไม่รู้จะกินอะไร? ลอง*ร้านนี้*','ร้านนี้ใน{area} *ต้องมา*','เบื่อร้านเดิมๆ? {name} ตอบโจทย์'],
    price:['กินอิ่มแค่ *{price}* {unit}!','{name} *{price}* คุ้มเกินคาด','อย่าเพิ่งเลื่อน! *{price}* ได้ขนาดนี้'],
    curious:['ร้านลับใน{area} *ใครรู้บ้าง?*','เมนูนี้ *ต้องสั่ง* ที่{name}','ทำไมคน*ต่อคิว*ร้านนี้'],
    proof:['ไปกินมาแล้ว บอกเลย*อร่อย*','รีวิว {name} จาก*การไปจริง*','ชิมแล้ว สรุปให้*ครบ*'],
    urgent:['ไป{area} ต้อง*แวะร้านนี้*!','เซฟไว้เลย *พิกัดร้านเด็ด*','ดูให้จบ แล้ว*ไปกินกัน*'] },
  hotel: {
    problem:['อยากพักสบาย แต่กลัวแพง? ดู*ที่นี่*','หาที่พักใน{area}อยู่? *จบที่นี่*','ห้องพักแบบนี้ *ต้องดู*'],
    price:['ที่พักแบบนี้ แค่ *{price}* {unit}!','{name} *{price}* {unit} คุ้มเว่อร์','อย่าเพิ่งเลื่อน! *{price}* พักได้เลย'],
    curious:['เปิดประตูเข้าห้อง แล้ว*ว้าว*','ที่พักใน{area} *วิวแบบนี้*เลยเหรอ','ห้องนี้มี*อะไร*ที่คุณคาดไม่ถึง'],
    proof:['พักมาแล้ว บอกเลย*คุ้ม*','รีวิว {name} จาก*การพักจริง*','Room tour ครบ *จบในคลิปเดียว*'],
    urgent:['*จองก่อน* ราคาอาจเปลี่ยน!','ที่พัก{area} *เซฟไว้เลย*','ดูให้จบ แล้ว*รีบจอง*'] },
  spot: {
    problem:['ไม่รู้จะเที่ยวไหน? *ที่นี่เลย*','เที่ยว{area} ห้าม*พลาด*ที่นี่','เบื่อที่เดิมๆ? ลอง*ที่นี่*'],
    price:['เที่ยวสนุกแค่ *{price}* {unit}!','{name} *{price}* คุ้มเว่อร์','อย่าเพิ่งเลื่อน! *{price}* เที่ยวได้เลย'],
    curious:['ที่เที่ยวลับใน{area} *ใครรู้บ้าง?*','มุมนี้ใน{name} *ต้องมา*','เที่ยวที่นี่ ต้องรู้*ข้อนี้*'],
    proof:['ไปมาแล้ว บอกเลย*คุ้ม*','รีวิว {name} จาก*ประสบการณ์จริง*','ไปเที่ยวมา สรุปให้*ครบ*'],
    urgent:['ไป{area} *เซฟไว้เลย*!','*จองตั๋ว*ก่อนไป ถูกกว่า!','ดูให้จบ แล้ว*รีบไป*'] },
};

// ====================================================================
//  state
// ====================================================================
const KEY = 'affEditor.v1';
const S = {
  step: 1, plat: 'tiktok', kind: 'product', placeType: 'food', area: '', rating: '', name: '', price: '', promo: '',
  clips: [], timeline: [], pool: [], analyzed: false,
  target: 30, strict: 2,
  hookStyle: 'problem', hook: '', hookIdx: 0, points: '', cta: '',
  priceSticker: true, disclose: true, fit: 'cover',
  sfxOn: true, musicOn: true, volOrig: 1, volSfx: 0.8, volMusic: 0.2,
  quality: '720', busy: false, result: null, genCaption: '',
};
const PERSIST = ['plat','kind','placeType','area','rating','name','price','promo','target','strict','hookStyle','points','priceSticker','disclose','fit','sfxOn','musicOn','volOrig','volSfx','volMusic','quality'];
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(PERSIST.map(k => [k, S[k]])))); } catch (e) {} };
let clipSeq = 0;

// เชื่อมกับรายการสินค้าในศูนย์วางแผน (index.html)
let hubItems = [];
try { const d = JSON.parse(localStorage.getItem('affHub.v1')); if (d && Array.isArray(d.items)) hubItems = d.items; } catch (e) {}
(function applyQuery() {
  const id = new URLSearchParams(location.search).get('item'); if (!id) return;
  const it = hubItems.find(x => String(x.id) === id); if (!it) return;
  S.name = it.name || S.name; S.price = it.price || S.price;
  if (PLAT[it.source]) S.plat = it.source;
  applyHubKind(it);
})();

function applyHubKind(it) {
  if (it.cat === 'hotel') { S.kind = 'place'; S.placeType = 'hotel'; }
  else if (it.cat === 'ticket') { S.kind = 'place'; S.placeType = 'spot'; }
  else S.kind = 'product';
}
function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1800); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('คัดลอกแล้ว ✓');
}

// ====================================================================
//  Hook
// ====================================================================
function hookOptions() {
  const isPlace = S.kind === 'place', grp = HOOKS[S.hookStyle];
  const list = isPlace ? HOOKS_PLACE[S.placeType][S.hookStyle] : (S.plat === 'trip' ? grp.trip : grp.retail);
  const price = S.price ? money(S.price) : '', area = (S.area || '').trim(), unit = isPlace ? PLACE[S.placeType].unit : '';
  return list.filter(t => (price || !t.includes('{price}')) && (area || !t.includes('{area}')))
    .map(t => t.replace(/\{name\}/g, S.name || (isPlace ? 'ที่นี่' : 'ตัวนี้')).replace(/\{price\}/g, price).replace(/\{area\}/g, area).replace(/\{unit\}/g, unit));
}
function pickHook(next) {
  const o = hookOptions(); if (!o.length) return;
  S.hookIdx = next ? (S.hookIdx + 1) % o.length : 0;
  S.hook = o[S.hookIdx];
}

// ====================================================================
//  วิเคราะห์คลิป — ตัดช่วงมืด / เบลอ / นิ่ง / เงียบ ออกอัตโนมัติ
// ====================================================================
function once(el, ev, ms = 20000) {
  return new Promise((res, rej) => {
    const cl = () => { el.removeEventListener(ev, ok); el.removeEventListener('error', er); clearTimeout(h); };

      cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.font = `700 ${W * 0.075}px ${FONT}`;

      cx.save(); cx.globalAlpha = clamp(k, 0, 1); cx.font = `700 ${W * 0.042}px ${FONT}`; cx.textAlign = 'left'; cx.textBaseline = 'middle';

  // ---------- เริ่มเล่น ----------
  const T0 = ac.currentTime + 0.15;

  if (S.sfxOn) SFX.boom(ac, sfxBus, T0);
  await sleep(150); t0w = performance.now(); requestAnimationFrame(frame);

  for (let i = 0; i < tl.length && !abortFlag; i++) {
    const s = tl[i], v = decks.get(s.clip.id), len = s.t1 - s.t0;

  </div>
  <div class="card"><h3>🔊 เสียง</h3>
    <label class="sw"><span>ซาวด์เอฟเฟกต์อัตโนมัติ</span><input type="checkbox" data-chk="sfxOn" ${S.sfxOn ? 'checked' : ''} /></label>
    <div class="sfxbtns">${SFX_LIST.map(([k, l]) => `<button class="btn sm" data-sfx="${k}">${l}</button>`).join('')}</div>
    <label class="lbl">ความดังซาวด์เอฟเฟกต์</label><input type="range" min="0" max="1" step="0.05" data-rng="volSfx" value="${S.volSfx}" />
    <label class="sw"><span>เพลงพื้นหลังจังหวะสนุก (สังเคราะห์เอง ไม่มีลิขสิทธิ์)</span><input type="checkbox" data-chk="musicOn" ${S.musicOn ? 'checked' : ''} /></label>
    <label class="lbl">ความดังเพลง</label><input type="range" min="0" max="0.6" step="0.02" data-rng="volMusic" value="${S.volMusic}" />
    <label class="lbl">ความดังเสียงต้นฉบับในคลิป</label><input type="range" min="0" max="1.5" step="0.05" data-rng="volOrig" value="${S.volOrig}" />
  </div>`;
}

function buildCaption() {
  const hook = hookText().replace(/\*/g, ''), p = PLAT[S.plat], pl = S.kind === 'place';
  const unit = pl ? PLACE[S.placeType].unit : '';
  const head = S.name ? `${S.name}${S.price ? ' ' + money(S.price) + (pl ? ' ' + unit : '') : ''}${S.promo ? ' · ' + S.promo : ''}` : '';
  const loc = pl ? [S.area && '📍 ' + S.area.trim(), S.rating && '⭐ ' + S.rating].filter(Boolean).join('  ') : '';
  const tags = pl ? [...PLACE[S.placeType].tags, ...p.tags.slice(0, 2), S.area && '#' + S.area.replace(/\s+/g, '')].filter(Boolean) : p.tags;
  const lines = [hook, '', head, loc, pointLines().map(x => '✅ ' + x).join('\n'), '', ctaText(), S.disclose ? '#โฆษณา #ลิงก์พันธมิตร' : '', tags.join(' ')];
  return lines.filter((l, i) => l || (i > 0 && lines[i - 1])).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
function viewExport() {
  ctaBtn('', '');
  const mime = pickMime(), isMp4 = mime.startsWith('video/mp4');
  S.genCaption = S.genCaption || buildCaption();
  return `
  <h2>4) ตัวอย่าง & ส่งออก</h2>
  <p class="sub">เล่นแบบเรียลไทม์เพื่ออัดเป็นไฟล์ ใช้เวลาเท่าความยาวคลิป (~${Math.round(totalLen() + 2)} วิ) กรุณาเปิดหน้านี้ค้างไว้</p>
  <div class="stage" id="stage"></div>
  <div class="prog" id="prog"><i></i></div>
  <div class="row" style="margin:12px 0"><button class="btn grow" id="btnPrev">▶ ดูตัวอย่าง</button><button class="btn pri grow" id="btnRender">🎬 สร้างวิดีโอ</button></div>
  <button class="btn block hidden" id="btnStop">⏹ หยุด</button>
  <div class="card"><h3>ตั้งค่าไฟล์</h3>
    <div class="chips"><button class="chip ${S.quality === '720' ? 'on' : ''}" data-q="720">720×1280 (เร็ว)</button><button class="chip ${S.quality === '1080' ? 'on' : ''}" data-q="1080">1080×1920 (คมชัด)</button></div>
    <label class="sw"><span>เส้นแนะนำพื้นที่ปลอดภัย (เฉพาะดูตัวอย่าง)</span><input type="checkbox" id="guide" ${showGuide ? 'checked' : ''} /></label>
    ${isMp4 || !mime ? '' : '<div class="note warn">เบราว์เซอร์นี้บันทึกเป็น .webm — แอป TikTok/Shopee บางเครื่องอาจไม่รับ แนะนำใช้ Chrome รุ่นล่าสุดบน Android หรือ Safari บน iPhone ที่บันทึกเป็น .mp4 ได้</div>'}
    ${mime ? '' : '<div class="note warn">เบราว์เซอร์นี้ไม่รองรับการอัดวิดีโอ ลองใช้ Chrome หรือ Safari รุ่นใหม่</div>'}
  </div>
  <div class="card hidden" id="resultCard"><h3>✅ วิดีโอพร้อมโพสต์</h3><video class="result" id="resVid" controls playsinline></video>
    <div class="row" style="margin-top:10px"><a class="btn pri grow" id="dl" style="text-align:center;line-height:50px;text-decoration:none;color:#1c0a00">⬇ บันทึกไฟล์</a><button class="btn grow hidden" id="share">📤 แชร์</button></div>
    <div class="note">ถ้าปุ่มบันทึกไม่ทำงาน ให้กดค้างที่วิดีโอแล้วเลือก “บันทึกวิดีโอ/Download”</div></div>
  <div class="card"><h3>📝 แคปชั่น + แฮชแท็ก</h3><textarea class="inp" rows="9" id="capTxt">${esc(S.genCaption)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn sm grow" id="capCopy">📋 คัดลอก</button><button class="btn sm grow" id="capGen">🔄 สร้างใหม่จากข้อมูลล่าสุด</button></div></div>`;
}

// ====================================================================
//  อีเวนต์
// ====================================================================
function afterRender() {
  const f = $('file'); if (f) f.onchange = async () => { for (const file of f.files) addClip(file); f.value = ''; S.analyzed = false; render(); };
  const g = $('goAnalyze'); if (g) g.onclick = doAnalyze;
  const h = $('goHook'); if (h) h.onclick = () => setStep(3);
  const e = $('goExport'); if (e) e.onclick = () => { S.genCaption = ''; setStep(4); };
  const hp = $('hubPick'); if (hp) hp.onchange = () => { const it = hubItems.find(x => String(x.id) === hp.value); if (!it) return;
    S.name = it.name; S.price = it.price; if (PLAT[it.source]) S.plat = it.source; applyHubKind(it); S.hook = ''; render(); };
  if (S.step === 4) bindExport();
  document.querySelectorAll('.clip video').forEach(v => v.addEventListener('loadedmetadata', () => {
    const c = S.clips.find(x => x.url === v.currentSrc.split('#')[0]); if (c && !c.dur && isFinite(v.duration)) c.dur = v.duration; }, { once: true }));
}
function addClip(file) {
  if (!file.type.startsWith('video/') && !/\.(mp4|mov|m4v|webm)$/i.test(file.name)) return;
  S.clips.push({ id: 'c' + (++clipSeq), file, url: URL.createObjectURL(file) });
}
async function doAnalyze() {
  if (S.busy || !S.clips.length) return;
  S.busy = true; $('cta').innerHTML = `<div class="card" style="margin:0 auto;max-width:528px"><div id="aTxt" style="font-size:13px;margin-bottom:6px">กำลังวิเคราะห์…</div><div class="prog"><i id="aBar"></i></div></div>`;
  try {
    for (let i = 0; i < S.clips.length; i++) {
      const c = S.clips[i]; $('aTxt').textContent = `กำลังวิเคราะห์คลิป ${i + 1}/${S.clips.length} · หาช่วงที่มืด/เบลอ/นิ่ง`;
      await analyzeClip(c, p => { $('aBar').style.width = ((i + p) / S.clips.length * 100) + '%'; });
    }
    autoAssemble(); S.analyzed = true; S.busy = false; S.hook = S.hook || ''; setStep(2);
    toast(S.timeline.length ? `ตัดอัตโนมัติแล้ว ${S.timeline.length} ช่วง` : 'ไม่พบช่วงที่ใช้ได้');
  } catch (err) { S.busy = false; render(); toast('วิเคราะห์ไม่สำเร็จ: ' + err.message); }
}

function bindExport() {
  const bar = $('prog').firstElementChild, setBusy = (b) => { S.busy = b; $('btnPrev').disabled = $('btnRender').disabled = b; $('btnStop').classList.toggle('hidden', !b); };
  const prog = (p) => { bar.style.width = (p * 100) + '%'; };
  cx.fillStyle = '#111'; cx.fillRect(0, 0, cv.width, cv.height);
  const go = async (record) => {
    if (S.busy) return; if (!S.timeline.length) return toast('ยังไม่มีช่วงวิดีโอ');
    setBusy(true); $('resultCard').classList.add('hidden');
    try {
      const blob = await runVideo({ record, onProg: prog });
      if (blob && blob.size) showResult(blob);
      else if (record && !abortFlag) toast('อัดวิดีโอไม่สำเร็จ');
    } catch (err) { toast('ผิดพลาด: ' + err.message); console.error(err); }
    setBusy(false); prog(0);
  };
  $('btnPrev').onclick = () => go(false);
  $('btnRender').onclick = () => go(true);
  $('btnStop').onclick = () => { abortFlag = true; };
  $('guide').onchange = (e) => { showGuide = e.target.checked; };
}
function showResult(blob) {
  if (S.result) URL.revokeObjectURL(S.result.url);
  const ext = blob.type.includes('mp4') ? 'mp4' : 'webm', url = URL.createObjectURL(blob), name = `affiliate-${S.plat}-${Date.now()}.${ext}`;
  S.result = { url, blob, name };
  $('resVid').src = url; $('dl').href = url; $('dl').download = name; $('resultCard').classList.remove('hidden');
  const file = new File([blob], name, { type: blob.type });
  let canShareFile = false; try { canShareFile = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
  if (canShareFile) { const b = $('share'); b.classList.remove('hidden'); b.onclick = () => navigator.share({ files: [file], text: $('capTxt').value }).catch(() => {}); }
  $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s);
  let b;
  if ((b = q('[data-step]'))) return setStep(+b.dataset.step);
  if ((b = q('[data-kind]'))) { S.kind = b.dataset.kind; S.hook = ''; S.cta = ''; S.points = S.points; return render(); }
  if ((b = q('[data-ptype]'))) { S.placeType = b.dataset.ptype; S.hook = ''; S.cta = ''; return render(); }
  if ((b = q('[data-plat]'))) { S.plat = b.dataset.plat; S.hook = ''; S.cta = ''; return render(); }
  if ((b = q('[data-rmclip]'))) { const i = S.clips.findIndex(c => c.id === b.dataset.rmclip); URL.revokeObjectURL(S.clips[i].url); S.clips.splice(i, 1); S.analyzed = false; return render(); }
  if ((b = q('[data-target]'))) { S.target = +b.dataset.target; autoAssemble(); return render(); }
  if ((b = q('[data-strict]'))) { S.strict = +b.dataset.strict; autoAssemble(); return render(); }
  if ((b = q('[data-up]'))) { const i = +b.dataset.up, t = S.timeline; [t[i - 1], t[i]] = [t[i], t[i - 1]]; return render(); }
  if ((b = q('[data-down]'))) { const i = +b.dataset.down, t = S.timeline; [t[i + 1], t[i]] = [t[i], t[i + 1]]; return render(); }
  if ((b = q('[data-del]'))) { const [s] = S.timeline.splice(+b.dataset.del, 1); s.reason = s.reason || ''; S.pool.unshift(s); return render(); }
  if ((b = q('[data-add]'))) { const [s] = S.pool.splice(+b.dataset.add, 1); s.reason = ''; S.timeline.push(s); return render(); }
  if ((b = q('[data-hookstyle]'))) { S.hookStyle = b.dataset.hookstyle; pickHook(false); return render(); }
  if ((b = q('[data-rehook]'))) { pickHook(true); return render(); }
  if ((b = q('[data-fit]'))) { S.fit = b.dataset.fit; return render(); }
  if ((b = q('[data-q]'))) { S.quality = b.dataset.q; return render(); }
  if ((b = q('[data-sfx]'))) return testSfx(b.dataset.sfx);
  if (q('#capCopy')) return copy($('capTxt').value);
  if (q('#capGen')) { S.genCaption = buildCaption(); $('capTxt').value = S.genCaption; return toast('สร้างแคปชั่นใหม่แล้ว'); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind) { S[t.dataset.bind] = t.value; persist(); }
  else if (t.dataset.segcap !== undefined) S.timeline[+t.dataset.segcap].caption = t.value;
  else if (t.dataset.rng) { S[t.dataset.rng] = +t.value; persist(); }
});
document.addEventListener('change', (e) => { const t = e.target; if (t.dataset.chk) { S[t.dataset.chk] = t.checked; persist(); } });

render();
</script>
</body>
</html>
